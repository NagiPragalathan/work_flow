<!doctype html><html><head><meta charset="utf-8">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:#fff;font-family:"Segoe UI",Arial,sans-serif}
  #stage{width:1560px;background:#fff;padding:10px}
</style></head>
<body><div id="stage">
<svg width="1560" height="900" viewBox="0 0 1560 900">
  <defs>
    <marker id="arrd" markerWidth="11" markerHeight="11" refX="9" refY="3.2" orient="auto">
      <path d="M0,0 L9,3.2 L0,6.4" fill="none" stroke="#8b5cf6" stroke-width="1.3"/>
    </marker>
  </defs>

  <!-- system boundary -->
  <rect x="295" y="96" width="1025" height="770" rx="16" fill="#fbfbff" stroke="#c7d2fe" stroke-width="2"/>
  <text x="807" y="128" text-anchor="middle" font-size="24" font-weight="800" fill="#4338ca" letter-spacing="1">AGENTFLOW WEB3 PLATFORM</text>

  <!-- builder actor -->
  <g stroke="#374151" stroke-width="2.2" fill="none">
    <circle cx="120" cy="430" r="20" fill="#eef2ff"/>
    <line x1="120" y1="450" x2="120" y2="510"/><line x1="86" y1="475" x2="154" y2="475"/>
    <line x1="120" y1="510" x2="92" y2="560"/><line x1="120" y1="510" x2="148" y2="560"/>
  </g>
  <text x="120" y="585" text-anchor="middle" font-size="17" font-weight="700" fill="#111827">Builder / Creator</text>

  <!-- end user actor -->
  <g stroke="#374151" stroke-width="2.2" fill="none">
    <circle cx="1470" cy="430" r="20" fill="#ecfdf5"/>
    <line x1="1470" y1="450" x2="1470" y2="510"/><line x1="1436" y1="475" x2="1504" y2="475"/>
    <line x1="1470" y1="510" x2="1442" y2="560"/><line x1="1470" y1="510" x2="1498" y2="560"/>
  </g>
  <text x="1470" y="585" text-anchor="middle" font-size="17" font-weight="700" fill="#111827">End User</text>

  <!-- builder connector lines -->
  <g stroke="#9ca3af" stroke-width="1.4">
    <line x1="150" y1="470" x2="415" y2="175"/><line x1="150" y1="470" x2="415" y2="265"/>
    <line x1="150" y1="470" x2="415" y2="355"/><line x1="150" y1="470" x2="415" y2="445"/>
    <line x1="150" y1="470" x2="415" y2="535"/><line x1="150" y1="470" x2="415" y2="625"/>
    <line x1="150" y1="470" x2="415" y2="715"/><line x1="150" y1="470" x2="415" y2="805"/>
  </g>
  <!-- end user connector lines -->
  <g stroke="#9ca3af" stroke-width="1.4">
    <line x1="1440" y1="470" x2="1245" y2="355"/><line x1="1440" y1="470" x2="1245" y2="455"/>
    <line x1="1440" y1="470" x2="1245" y2="555"/><line x1="1440" y1="470" x2="1245" y2="655"/>
  </g>

  <!-- extend / include dashed -->
  <g stroke="#8b5cf6" stroke-width="1.4" stroke-dasharray="6 5" marker-end="url(#arrd)" fill="none">
    <line x1="625" y1="250" x2="712" y2="206"/>
    <line x1="625" y1="280" x2="712" y2="300"/>
    <line x1="625" y1="535" x2="712" y2="535"/>
    <line x1="1140" y1="485" x2="1140" y2="525"/>
  </g>
  <text x="648" y="218" font-size="13.5" font-style="italic" fill="#7c3aed">«extend»</text>
  <text x="648" y="296" font-size="13.5" font-style="italic" fill="#7c3aed">«extend»</text>
  <text x="650" y="527" font-size="13.5" font-style="italic" fill="#7c3aed">«include»</text>
  <text x="1148" y="510" font-size="13.5" font-style="italic" fill="#7c3aed">«include»</text>

  <!-- LEFT COLUMN (builder) cx=520 -->
  <g font-size="16.5" font-weight="600" fill="#1e1b4b" text-anchor="middle">
    <ellipse cx="520" cy="175" rx="105" ry="30" fill="#eef2ff" stroke="#6366f1" stroke-width="1.6"/><text x="520" y="180">Register / Login</text>
    <ellipse cx="520" cy="265" rx="105" ry="30" fill="#eef2ff" stroke="#6366f1" stroke-width="1.6"/><text x="520" y="270">Compose Workflow</text>
    <ellipse cx="520" cy="355" rx="105" ry="30" fill="#eef2ff" stroke="#6366f1" stroke-width="1.6"/><text x="520" y="360">Configure Blocks</text>
    <ellipse cx="520" cy="445" rx="105" ry="30" fill="#eef2ff" stroke="#6366f1" stroke-width="1.6"/><text x="520" y="450">Run / Test Workflow</text>
    <ellipse cx="520" cy="535" rx="105" ry="30" fill="#eef2ff" stroke="#6366f1" stroke-width="1.6"/><text x="520" y="540">Build Interface Page</text>
    <ellipse cx="520" cy="625" rx="105" ry="30" fill="#eef2ff" stroke="#6366f1" stroke-width="1.6"/><text x="520" y="630">Publish dApp</text>
    <ellipse cx="520" cy="715" rx="105" ry="30" fill="#eef2ff" stroke="#6366f1" stroke-width="1.6"/><text x="520" y="720">Use AI Assistant</text>
    <ellipse cx="520" cy="805" rx="105" ry="30" fill="#eef2ff" stroke="#6366f1" stroke-width="1.6"/><text x="520" y="810">Save as Template</text>
  </g>

  <!-- MIDDLE extend/include ovals cx=820 -->
  <g font-size="16" font-weight="600" fill="#4c1d95" text-anchor="middle">
    <ellipse cx="820" cy="206" rx="108" ry="29" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="1.5" stroke-dasharray="5 4"/><text x="820" y="211">Add On-Chain Block</text>
    <ellipse cx="820" cy="300" rx="108" ry="29" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="1.5" stroke-dasharray="5 4"/><text x="820" y="305">Add AI Agent Block</text>
    <ellipse cx="820" cy="535" rx="108" ry="29" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="1.5" stroke-dasharray="5 4"/><text x="820" y="540">Bind UI to Workflow</text>
  </g>

  <!-- RIGHT COLUMN (end user) cx=1140 -->
  <g font-size="16.5" font-weight="600" fill="#064e3b" text-anchor="middle">
    <ellipse cx="1140" cy="355" rx="105" ry="30" fill="#ecfdf5" stroke="#10b981" stroke-width="1.6"/><text x="1140" y="360">Open Hosted dApp</text>
    <ellipse cx="1140" cy="455" rx="105" ry="30" fill="#ecfdf5" stroke="#10b981" stroke-width="1.6"/><text x="1140" y="460">Submit Input</text>
    <ellipse cx="1140" cy="555" rx="105" ry="30" fill="#ecfdf5" stroke="#10b981" stroke-width="1.6"/><text x="1140" y="560">Run Bound Workflow</text>
    <ellipse cx="1140" cy="655" rx="105" ry="30" fill="#ecfdf5" stroke="#10b981" stroke-width="1.6"/><text x="1140" y="660">View On-Chain Result</text>
  </g>

  <!-- legend -->
  <g font-size="13" fill="#4b5563">
    <rect x="330" y="824" width="16" height="16" rx="3" fill="#eef2ff" stroke="#6366f1"/><text x="354" y="837">Builder use cases</text>
    <rect x="520" y="824" width="16" height="16" rx="3" fill="#ecfdf5" stroke="#10b981"/><text x="544" y="837">End-user use cases</text>
    <line x1="720" y1="832" x2="756" y2="832" stroke="#8b5cf6" stroke-width="1.6" stroke-dasharray="6 5"/><text x="764" y="837">«include» / «extend»</text>
  </g>
</svg>
</div></body></html>
